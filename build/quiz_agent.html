gs":1,"description":"**Новая мысль** (New Thought, XIX в., США) — движение о силе мысли: «мышление создаёт реальность», исцеление сознанием, процветание. ## Суть Корни: трансцендентализм (Эмерсон), мез","eras":["xix"]},{"title":"Нью-эйдж","link":"https://oaker.github.io/veroteka/ru/06_esoteric/new_age/new_age.html","family":"Эзотерика","axis":null,"year":"1960–1970-е","tags":["эзотерика","НРД","__i253"],"ntags":2,"description":"«новая эра»: диффузное движение (1960-е →) о духовном самосовершенствовании вне догм: кристаллы, медитации, ченнелинг, астрология, рейки.","eras":["xx"]},{"title":"Розенкрейцерство","link":"https://oaker.github.io/veroteka/ru/06_esoteric/rosicrucianism/rosicrucianism.html","family":"Эзотерика","axis":null,"year":"1614 (манифесты)","tags":["эзотерика","__i254"],"ntags":1,"description":"эзотерическое братство, заявленное в манифестах XVII века (перекрещенная роза): герметизм, алхимия и духовное обновление Европы.","eras":["earlymodern","em2"]},{"title":"Сатанизм ЛаВея","link":"https://oaker.github.io/veroteka/ru/06_esoteric/la_vey_satanism/la_vey_satanism.html","family":"Эзотерика","axis":null,"year":"1966","tags":["эзотерика","НРД","спорный статус","__i255"],"ntags":3,"description":"**Сатанизм Антона ЛаВея** (Церковь Сатаны, 1966, Сан-Франциско) — атеистическая «религия» с сатаной как символом, а не существом. ## Суть - «Сатана» — символ эгоизма, свободы и пло","eras":["xx"]},{"title":"Спиритуализм","link":"https://oaker.github.io/veroteka/ru/06_esoteric/spiritualism/spiritualism.html","family":"Эзотерика","axis":null,"year":"1848 (Фоксы, Гайдсвилл)","tags":["эзотерика","__i256"],"ntags":1,"description":"вера в общение с духами умерших через медиумов; массовое движение XIX века (около 1850-х, США).","eras":["xix"]},{"title":"Таро","link":"https://oaker.github.io/veroteka/ru/06_esoteric/tarot/tarot.html","family":"Эзотерика","axis":null,"year":"XV в. (карты) / 1781 (оккультное таро)","tags":["эзотерика","символизм","__i257"],"ntags":2,"description":"колода карт (XV в.","eras":["medieval","earlymodern","em3"]},{"title":"Телема","link":"https://oaker.github.io/veroteka/ru/06_esoteric/thelema/thelema.html","family":"Эзотерика","axis":null,"year":"1904","tags":["эзотерика","НРД","__i258"],"ntags":2,"description":"**Телема** («воля») — религиозно-философская система Алистера Кроули (1904, «Книга Закона»). ## Суть - «Делай что изволишь — таков весь Закон» (Do what thou wilt shall be the whole","eras":["xx"]},{"title":"Теософия","link":"https://oaker.github.io/veroteka/ru/06_esoteric/theosophy/theosophy.html","family":"Эзотерика","axis":null,"year":"1875 (Блаватская)","tags":["эзотерика","НРД","__i259"],"ntags":2,"description":"эзотерическое движение Елены Блаватской (Теософское общество, 1875, Нью-Йорк): синтез восточных религий, западного оккультизма и «древней мудрости».","eras":["xix"]},{"title":"Хаос-магия","link":"https://oaker.github.io/veroteka/ru/06_esoteric/magic/chaos_magic/chaos_magic.html","family":"Эзотерика","axis":null,"year":"1970-е (Спейр, Кэрролл)","tags":["эзотерика","магия","__i260"],"ntags":2,"description":"современный оккультизм (1970–80-е, Остин Осман Спейр, Алистер Кроули — предтеча, «Liber Null» Пита Кэрролла): парадигма, а не догма.","eras":["xx"]},{"title":"Эзотерика и оккультизм","link":"https://oaker.github.io/veroteka/ru/06_esoteric/06_esoteric.html","family":"Эзотерика","axis":null,"year":"II–IV вв. (герметизм) → XIX–XX вв.","tags":["эзотерика","__i261"],"ntags":1,"description":"«Тайные знания»: алхимия, астрология, магия, каббала. Про них больше всего врут — поэтому тут отделяют историю от сказок, спокойно и с иронией.","eras":[]}]}</script>
<script>(function(){ window.QuizEngine = (function(){
  'use strict';

  var AXES = ['dvaita', 'advaita', 'sunyata'];
  var ERAS = ['ancient', 'medieval', 'earlymodern', 'em1', 'em2', 'em3', 'xix', 'xx', 'xxi'];
  var FIRST_Q = 'axis_split';
  var FINAL_Q = '__final__';

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function romanToInt(s) {
    var map = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
    var r = 0;
    s = s.toUpperCase();
    for (var i = 0; i < s.length; i++) {
      var c = map[s.charAt(i)];
      var n = map[s.charAt(i + 1)];
      if (!c) continue;
      r += (n && n > c) ? -c : c;
    }
    return r;
  }

  // Грубая эра + подключковое дробление Нового времени (em1: XVI в., em2: XVII в., em3: XVIII в.).
  function parseEras(year) {
    var out = [];
    function push(e) { if (e && out.indexOf(e) === -1) out.push(e); }
    if (!year) return out;
    var s = String(year);
    if (/до\s*н\.?\s*э/i.test(s)) push('ancient');
    var m;
    var romanRe = /\b([IVXLC]+)\s*(в\.|век|тыс|тыс\.)/gi;
    while ((m = romanRe.exec(s))) {
      var isThousand = /тыс/i.test(m[2]);
      var c = romanToInt(m[1]);
      if (isThousand) { push('ancient'); continue; }
      if (c <= 5) push('ancient');
      else if (c <= 15) push('medieval');
      else if (c === 16) { push('earlymodern'); push('em1'); }
      else if (c === 17) { push('earlymodern'); push('em2'); }
      else if (c === 18) { push('earlymodern'); push('em3'); }
      else if (c === 19) push('xix');
      else if (c === 20) push('xx');
      else if (c >= 21) push('xxi');
    }
    var yrRe = /\b(\d{1,4})\b/g;
    while ((m = yrRe.exec(s))) {
      var y = parseInt(m[1], 10);
      if (y >= 1000 && y <= 2099) {
        if (y <= 1450) push('medieval');
        else if (y <= 1599) { push('earlymodern'); push('em1'); }
        else if (y <= 1699) { push('earlymodern'); push('em2'); }
        else if (y <= 1799) { push('earlymodern'); push('em3'); }
        else if (y <= 1900) push('xix');
        else if (y <= 2000) push('xx');
        else push('xxi');
      } else {
        if (y <= 500) push('ancient');
        else if (y <= 1450) push('medieval');
        else if (y <= 1900) push('xix');
        else if (y <= 2000) push('xx');
        else push('xxi');
      }
    }
    return out;
  }

  function createGame(seed) {
    return { seed: (seed >>> 0) || 1, answers: [] };
  }

  function jitters(state, n) {
    var r = mulberry32(state.seed ^ 0x9E3779B9);
    var out = new Array(n);
    for (var i = 0; i < n; i++) out[i] = r() * 0.3;
    return out;
  }

  function zeroPts() {
    return {
      axis: { dvaita: 0, advaita: 0, sunyata: 0 },
      family: {
        'Авраамические': 0, 'Дхармические': 0, 'Региональные': 0, 'Эзотерика': 0,
        'Древние': 0, 'Новые движения': 0, 'Иранские': 0
      },
      tag: {},
      era: { ancient: 0, medieval: 0, earlymodern: 0, em1: 0, em2: 0, em3: 0, xix: 0, xx: 0, xxi: 0 }
    };
  }

  function addEffect(pts, e) {
    if (!e) return;
    var k;
    if (e.a) for (k in e.a) { pts.axis[k] = (pts.axis[k] || 0) + e.a[k]; }
    if (e.f) for (k in e.f) { pts.family[k] = (pts.family[k] || 0) + e.f[k]; }
    if (e.t) for (k in e.t) { pts.tag[k] = (pts.tag[k] || 0) + e.t[k]; }
    if (e.e) for (k in e.e) { pts.era[k] = (pts.era[k] || 0) + e.e[k]; }
  }

  function clonePts(p) {
    var out = {
      axis: { dvaita: p.axis.dvaita, advaita: p.axis.advaita, sunyata: p.axis.sunyata },
      family: {}, tag: {}, era: {}
    };
    var k;
    for (k in p.family) out.family[k] = p.family[k];
    for (k in p.tag) out.tag[k] = p.tag[k];
    for (k in p.era) out.era[k] = p.era[k];
    return out;
  }

  function qIndex(QUESTIONS) {
    var m = {};
    for (var i = 0; i < QUESTIONS.length; i++) m[QUESTIONS[i].id] = QUESTIONS[i];
    return m;
  }

  function pointsFor(state, QUESTIONS) {
    var pts = zeroPts();
    var idx = qIndex(QUESTIONS);
    for (var i = 0; i < state.answers.length; i++) {
      var a = state.answers[i];
      if (a.e) { addEffect(pts, a.e); continue; } // динамический финальный вопрос: эффект сохранён в ответе
      var q = idx[a.q];
      if (!q || !q.opts[a.o]) continue;
      addEffect(pts, q.opts[a.o].e);
    }
    return pts;
  }

  // Теги нормируем на √(размер набора); тонкие наборы (зонтичные статьи) получают компенсацию:
  // иначе «Ислам» (2 тега) всегда проигрывает «Ханафитам» (3 тега) с теми же ответами.
  function thicknessBonus(tags) {
    var real = 0;
    for (var i = 0; i < tags.length; i++) if (tags[i].charAt(0) !== '_') real++;
    return 0.35 * (4 - Math.min(4, Math.max(1, real)));
  }

  // Немного личного шармa: выбранные пользователем традиции получают лёгкое постоянное преимущество.
  var CHARM = { 'Каширский шиваизм': 1.3, 'Адвайта-джаглинг (недуальное жонглирование)': 1.3 };

  function scoreItem(item, pts, jit) {
    var s = 0.6 + (CHARM[item.title] || 0);
    if (item.axis) {
      s += 1.15 * (pts.axis[item.axis] || 0);
    } else {
      var avg = ((pts.axis.dvaita || 0) + (pts.axis.advaita || 0) + (pts.axis.sunyata || 0)) / 3;
      s += 0.55 * avg;
    }
    s += 0.95 * (pts.family[item.family] || 0);
    var tags = item.tags || [];
    var ntags = item.ntags || tags.length;
    if (tags.length) {
      var tsum = 0;
      for (var i = 0; i < tags.length; i++) {
        var tv = pts.tag[tags[i]] || 0;
        if (tv > 0) tsum += tv;
      }
      s += (0.9 / Math.sqrt(Math.min(4, Math.max(1, ntags)))) * Math.min(6, tsum);
    }
    s += thicknessBonus(tags);
    var eras = item.eras || parseEras(item.year);
    for (var j = 0; j < eras.length; j++) {
      s += 1.0 * (pts.era[eras[j]] || 0) * (j === 0 ? 1 : 0.6);
    }
    return s + (jit || 0);
  }

  // Скор итема с дополнительным эффектом e без материализации клона pts.

    var s = 0.6 + (CHARM[item.title] || 0);
    var ea = e && e.a, ef = e && e.f, et = e && e.t, ee = e && e.e;
    var a1, a2, a3;
    a1 = (pts.axis.dvaita || 0) + (ea && ea.dvaita || 0);
    a2 = (pts.axis.advaita || 0) + (ea && ea.advaita || 0);
    a3 = (pts.axis.sunyata || 0) + (ea && ea.sunyata || 0);
    if (item.axis) {
      s += 1.15 * (item.axis === 'dvaita' ? a1 : item.axis === 'advaita' ? a2 : a3);
    } else {
      s += 0.55 * ((a1 + a2 + a3) / 3);
    }
    s += 0.95 * ((pts.family[item.family] || 0) + (ef && ef[item.family] || 0));
    var tags = item.tags || [];
    if (tags.length) {
      var tsum = 0;
      for (var i = 0; i < tags.length; i++) {
        var tv = (pts.tag[tags[i]] || 0) + (et && et[tags[i]] || 0);
        if (tv > 0) tsum += tv;
      }
      s += (0.9 / Math.sqrt(Math.min(4, Math.max(1, tags.length)))) * Math.min(6, tsum);
    }
    s += thicknessBonus(tags);
    var eras = item.eras || parseEras(item.year);
    for (var j = 0; j < eras.length; j++) {
      var ev = (pts.era[eras[j]] || 0) + (ee && ee[eras[j]] || 0);
      s += 1.0 * ev * (j === 0 ? 1 : 0.6);
    }
    return s + (jit || 0);
  }

  function scoresWith(state, data, QUESTIONS, pts, jit) {
    var out = new Array(data.items.length);
    for (var i = 0; i < data.items.length; i++) {
      out[i] = scoreItem(data.items[i], pts, jit[i]);
    }
    return out;
  }

  function scores(state, data, QUESTIONS) {
    var pts = pointsFor(state, QUESTIONS);
    var jit = jitters(state, data.items.length);
    return scoresWith(state, data, QUESTIONS, pts, jit);
  }

  function sortedOrder(sc) {
    var order = [];
    for (var i = 0; i < sc.length; i++) order.push(i);
    order.sort(function (a, b) { return sc[b] - sc[a]; });
    return order;
  }

  // Относительный отрыв лидера: (s1-s2)/max(|s1|,|s2|).
  function marginOf(sc) {
    var order = sortedOrder(sc);
    var s1 = sc[order[0]], s2 = sc[order[1]];
    return (s1 - s2) / (Math.max(Math.abs(s1), Math.abs(s2)) + 1e-9);
  }

  function discriminate(q, leaderIdx, data, pts, jit) {
    var gains = [];
    var argmaxByLeader = {};
    var openedFamilies = {};
    for (var li = 0; li < leaderIdx.length; li++) {
      var i = leaderIdx[li];
      var item = data.items[i];
      var best = -1e9, bestOpt = -1;
      for (var o = 0; o < q.opts.length; o++) {
        var s = scoreItemWithEffect(item, pts, q.opts[o].e, jit[i]);
        if (s > best) { best = s; bestOpt = o; }
      }
      gains.push(best);
      argmaxByLeader[bestOpt] = (argmaxByLeader[bestOpt] || 0) + 1;
      // Семейство "открывается", если у лидера почти не было family-очков, а этот вопрос их даёт.
      if (!(pts.family[item.family] > 0.8) && q.opts[bestOpt].e && q.opts[bestOpt].e.f && q.opts[bestOpt].e.f[item.family] > 0) {
        openedFamilies[item.family] = true;
      }
    }
    var mean = 0;
    for (var g = 0; g < gains.length; g++) mean += gains[g];
    mean /= gains.length;
    var vr = 0;
    for (var g2 = 0; g2 < gains.length; g2++) vr += (gains[g2] - mean) * (gains[g2] - mean);
    var stdev = Math.sqrt(vr / gains.length);
    var distinct = 0;
    for (var k in argmaxByLeader) distinct++;
    var opened = 0;
    for (var k2 in openedFamilies) opened++;
    return stdev + 0.2 * distinct + 1.2 * opened;
  }

  // Семейства или теги, которые вопрос может "открыть" (≥1.5 очков цели без текущих очков).
  function openerFams(q, pts) {
    var fams = 0;
    for (var o = 0; o < q.opts.length; o++) {
      var f = q.opts[o].e && q.opts[o].e.f;
      if (f) for (var k in f) if (f[k] >= 1.5 && !(pts.family[k] > 0.8)) fams += 1;
      var t = q.opts[o].e && q.opts[o].e.t;
      if (t) for (var k2 in t) if (t[k2] >= 1.5 && !(pts.tag[k2] > 0.8)) fams += 1;
    }
    return fams;
  }

  // Один расчёт на шаг: решение «финиш?» + выбор следующего вопроса.
  // Фокус сужается с ходами: сначала топ-36, к 6-му шагу — топ-10.
  function step(state, data, QUESTIONS) {
    var n = state.answers.length;
    var la = n ? state.answers[n - 1] : null;
    // Последний ответ — финальный выбор: конец.
    if (la && la.q === FINAL_Q && typeof la.finalPick === 'number') return { done: true, reason: 'final', qid: null, margin: 0 };
    // Последний ответ — «показать другие»: снова финальный вопрос (следующая страница).
    if (la && la.q === FINAL_Q && la.o === 'more') return { done: false, qid: FINAL_Q, margin: 0 };
    if (la && la.q === FINAL_Q) return { done: true, reason: 'final', qid: null, margin: 0 };
    var pts = pointsFor(state, QUESTIONS);
    var jit = jitters(state, data.items.length);
    var sc = scoresWith(state, data, QUESTIONS, pts, jit);
    var margin = marginOf(sc);
    var stopStatic = (n >= 10 && margin > 0.55) || (n >= 12 && margin > 0.3) || n >= 13;
    if (stopStatic) {
      // Вместо немедленного финиша — уточняющий вопрос из топа (сужение выбора).
      return { done: false, qid: FINAL_Q, margin: margin };
    }
    if (n >= QUESTIONS.length) return { done: true, reason: 'no-questions', qid: null, margin: margin };
    if (n === 0) return { done: false, qid: FIRST_Q, margin: margin };
    var used = {};
    for (var i = 0; i < state.answers.length; i++) used[state.answers[i].q] = true;
    var order = sortedOrder(sc);
    var K = Math.max(10, 42 - 6 * n);
    var leaders = order.slice(0, Math.min(K, order.length));
    var best = null, bestDisc = 0;
    var useOpener = (n === 2 || n === 5 || n === 8 || n === 10);
    for (var pass = 0; pass < 2 && !best; pass++) {
      for (var q = 0; q < QUESTIONS.length; q++) {
        var question = QUESTIONS[q];
        if (used[question.id]) continue;
        var op = openerFams(question, pts);
        if (pass === 0 && useOpener && op === 0) continue; // на слотах — только открыватели
        var d = discriminate(question, leaders, data, pts, jit);
        d += 0.5 * op;
        if (d > bestDisc) { bestDisc = d; best = question.id; }
      }
      if (!useOpener) break;
    }
    if (!best || bestDisc <= 0.05) return { done: true, reason: 'no-questions', qid: null, margin: margin };
    return { done: false, qid: best, margin: margin };
  }

  function nextQuestion(state, data, QUESTIONS) {
    var st = step(state, data, QUESTIONS);
    return st.done ? null : st.qid;
  }

  function finished(state, data, QUESTIONS) {
    var n = state.answers.length;
    if (n === 0) return { done: false, reason: 'start' };
    var st = step(state, data, QUESTIONS);
    return { done: st.done, reason: st.reason };
  }

  // Финальный уточняющий вопрос: топ-4 кандидата (без ранее показанных), явный выбор пользователя.
  function finalEffect(item) {
    var uniq = null;
    for (var i = 0; i < (item.tags || []).length; i++) {

    }

      if (state.answers[a].q === FINAL_Q && state.answers[a].shown) {
        for (var s = 0; s < state.answers[a].shown.length; s++) shown[state.answers[a].shown[s]] = true;
      }
    }
    var sc = scores(state, data, QUESTIONS);
    var order = sortedOrder(sc);
    var opts = [];
    var shownNow = [];
    for (var i = 0; i < order.length && opts.length < 4; i++) {
      var it = data.items[order[i]];
      if (shown[it.title]) continue;
      opts.push({
        t: it.title,
        desc: it.description,
        idx: order[i],
        e: finalEffect(it)
      });
      shownNow.push(it.title);
    }
    var canPage = false;
    var pagesUsed = 0;
    for (var a2 = 0; a2 < state.answers.length; a2++) if (state.answers[a2].q === FINAL_Q && state.answers[a2].o === 'more') pagesUsed++;
    if (pagesUsed < 8) {
      for (var i2 = 0; i2 < order.length; i2++) { if (!shown[data.items[order[i2]].title]) { canPage = true; break; } }

    return { id: FINAL_Q, q: 'Ваш круг сузился до нескольких близких традиций. Какая из них отзывается больше всего?', opts: opts, canPage: canPage, shown: shownNow };
  }

  function result(state, data, QUESTIONS) {
    var sc = scores(state, data, QUESTIONS);
    var order = sortedOrder(sc);
    var winner = order[0];
    // Явный выбор пользователя в финальном вопросе главнее скоринга.
    var la = state.answers.length ? state.answers[state.answers.length - 1] : null;
    if (la && la.q === FINAL_Q && typeof la.finalPick === 'number' && la.finalPick >= 0 && la.finalPick < data.items.length) {
      winner = la.finalPick;
    }
    var runners = [];
    var seenTitles = {};
    seenTitles[data.items[winner].title] = true;
    for (var i = 0; i < order.length && runners.length < 3; i++) {
      var it = data.items[order[i]];
      if (it.title === data.items[winner].title || seenTitles[it.title]) continue;
      seenTitles[it.title] = true;
      runners.push(order[i]);
    }
    return { winner: winner, runners: runners, scores: sc, order: order };
  }

  return {
    AXES: AXES,
    ERAS: ERAS,
    FIRST_Q: FIRST_Q,
    mulberry32: mulberry32,
    parseEras: parseEras,
    createGame: createGame,
    jitters: jitters,
    zeroPts: zeroPts,
    addEffect: addEffect,
    clonePts: clonePts,
    pointsFor: pointsFor,
    scoreItem: scoreItem,
    scoreItemWithEffect: scoreItemWithEffect,
    scores: scores,
    sortedOrder: sortedOrder,
    marginOf: marginOf,
    step: step,
    nextQuestion: nextQuestion,
    finished: finished,
    FINAL_Q: FINAL_Q,
    finalQuestion: finalQuestion,
    finalEffect: finalEffect,
    result: result
  };
})();})();</script>

<script>
(function(){
'use strict';
var data = JSON.parse(document.getElementById('quiz-data').textContent);
var Q = window.QUIZ_QUESTIONS;
var E = window.QuizEngine;
var app = document.getElementById('app');
var state = null;
var qid = null;
var lastFinal = null;
var esc = function(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;};

function start(){ state = E.createGame((Math.random()*4294967295)>>>0); qid = null; render(); }

function answer(o){
  if (lastFinal){
    if (o === 'more'){
      state.answers.push({ q: E.FINAL_Q, o: 'more', shown: lastFinal.shown });
      qid = null; lastFinal = null;
      render();
      return;
    }
    var opt = lastFinal.opts[o];
    state.answers.push({ q: E.FINAL_Q, o: opt.idx, e: opt.e, finalPick: opt.idx, shown: lastFinal.shown });
    renderResult();
    return;
  }
  state.answers.push({q:qid,o:o});
  qid = null;
  render();
}

function back(){ if(state.answers.length){ state.answers.pop(); } qid=null; lastFinal=null; render(); }

function render(){
  var st = E.step(state,data,Q);
  if (st.done || !st.qid){ renderResult(); return; }
  qid = st.qid;
  var question;
  if (qid === E.FINAL_Q){
    question = E.finalQuestion(state,data,Q);
    // Динамический вопрос: сохраняем индексы кандидатов и эффекты для фазы answer.
    lastFinal = question;
  } else {
    question = Q.filter(function(x){return x.id===qid;})[0];
    lastFinal = null;
  }
  var total = st.reason==='start' ? 12 : Math.max(12, state.answers.length+2);
  var pct = Math.min(100, Math.round(state.answers.length/total*100));
  var html = '<div class="stage"><div class="progress"><div style="width:'+pct+'%"></div></div>';
  html += '<p class="qtext">'+esc(question.q)+'</p><div class="opts">';
  question.opts.forEach(function(o,i){
    var label = esc(o.t);
    if (qid === E.FINAL_Q && o.desc) label += '<br><span class="opt-desc">'+esc(o.desc)+'</span>';
    html += '<button type="button" class="opt" data-o="'+i+'">'+label+'</button>';
  });
  if (qid === E.FINAL_Q && lastFinal && lastFinal.canPage) {
    html += '<button type="button" class="opt" data-o="more" style="color:var(--muted)">Ни одна не отзывается — показать другие</button>';
  }
  html += '</div><div class="row">';
  html += state.answers.length ? '<button type="button" class="btn-ghost" id="backBtn">← Назад</button>' : '<span></span>';
  html += '</div></div>';
  app.innerHTML = html;
  Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
    b.addEventListener('click', function(){ answer(parseInt(b.getAttribute('data-o'),10)); });
  });
  var bb = document.getElementById('backBtn');
  if (bb) bb.addEventListener('click', back);
}

function renderResult(){
  var r = E.result(state,data,Q);
  var w = data.items[r.winner];
  var badges = esc(w.family);
  if (w.year) badges += ' <span class="badge">'+esc(w.year)+'</span>';
  (w.tags || []).filter(t => t.charAt(0) !== '_').slice(0, 6).forEach(function(t){ badges += ' <span class="badge">'+esc(t)+'</span>'; });
  var html = '<div class="stage card">';
  html += '<p class="lead" style="margin-bottom:4px">Вам ближе всего:</p>';
  html += '<div class="result-title">'+esc(w.title)+'</div>';
  html += '<div>'+badges+'</div>';
  html += '<p class="result-desc">'+esc(w.description)+'</p>';
  html += '<a class="btn-primary" href="'+esc(w.link)+'" target="_blank" rel="noopener">Читать статью →</a>';
  if (r.runners.length){
    html += '<div class="runners"><h3>Тоже может откликнуться</h3>';
    r.runners.forEach(function(i){
      var it = data.items[i];
      html += '<a class="runner" href="'+esc(it.link)+'" target="_blank" rel="noopener"><b>'+esc(it.title)+'</b> — '+esc(it.family)+(it.year?', '+esc(it.year):'')+'</a>';
    });
    html += '</div>';
  }
  html += '<div class="row"><button type="button" class="btn-primary" id="againBtn">Пройти ещё раз</button></div>';
  html += '</div>';
  app.innerHTML = html;
  document.getElementById('againBtn').addEventListener('click', start);
}

start();
})();
</script>
